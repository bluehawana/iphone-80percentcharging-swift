name: ChargeGuard

options:
  bundleIdPrefix: com.bluehawana
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Your Apple Developer team ID. Set DEVELOPMENT_TEAM in .env (gitignored) and
    # generate the project with ./scripts/setup.sh — nobody has to edit this file.
    # Automatic signing then lets the app run on your iPhone and reach the App Store.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  ChargeGuard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ChargeGuard
      # Generated from .env by scripts/gen-dev-credentials.sh and gitignored, so it may
      # not exist yet on a fresh clone. `optional` keeps it in the project regardless;
      # the pre-build script below guarantees it exists before compilation.
      - path: ChargeGuard/Core/DevCredentials.generated.swift
        optional: true
    preBuildScripts:
      - name: Generate DEBUG credentials from .env
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/gen-dev-credentials.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluehawana.chargeguard
        PRODUCT_NAME: ChargeGuard
        INFOPLIST_KEY_CFBundleDisplayName: "Charge Guard"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Only HTTPS/TLS is used, which is exempt encryption. Declaring it here means
        # App Store Connect stops asking the export-compliance question on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # macOS: allow outbound network from the sandbox (Tuya Cloud API).
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ChargeGuard/ChargeGuard.entitlements
